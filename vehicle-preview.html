<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c131d" />
    <title>SF Taxi Preview · Earth Online</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c131d;
        color: #f5f0e7;
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      }
      #scene {
        display: block;
        width: 100%;
        height: 100%;
      }
      .bar {
        position: fixed;
        left: 1rem;
        right: 1rem;
        bottom: 1rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1.25rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1rem;
        border: 1px solid rgba(245, 240, 231, 0.14);
        border-radius: 0.7rem;
        background: rgba(12, 19, 29, 0.72);
        backdrop-filter: blur(14px);
        font-size: 0.78rem;
      }
      .bar a {
        color: #6bd6c5;
        text-decoration: none;
      }
      #status {
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="SF taxi Three.js preview"></canvas>
    <div class="bar">
      <span id="status">Loading taxi…</span>
      <span>
        <a href="./assets/vehicles/sf-taxi-theme-polished.png">Reference image</a>
        ·
        <a href="./index.html">Back to city</a>
      </span>
    </div>
    <script type="module" src="/src/vehicles/preview.js"></script>
  </body>
</html>
